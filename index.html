<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carlo Russo | Portfolio</title>
  <link rel="stylesheet" href="CSS/Experience.css" />
  <link rel="stylesheet" href="CSS/Style.css" />
  <link rel="stylesheet" href="CSS/Project.css" />
  <link rel="stylesheet" href="CSS/About.css" />
  <link rel="stylesheet" href="CSS/Resume.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { background: #0b1020; color: #e8efff; }
    .bg-video { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-video video { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .bg-tint {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(120% 120% at 50% 10%, rgba(0, 20, 60, .28), rgba(0, 0, 0, .5)),
        linear-gradient(180deg, rgba(6, 12, 28, .2), rgba(6, 12, 28, .75));
    }
    .site-header { z-index: 1000; }
    .portfolio-page { position: relative; z-index: 2; }
    @media (prefers-reduced-motion: reduce) {
      .bg-video video { display: none; }
      .bg-video { background: center/cover no-repeat var(--poster-url, #0b1020); }
    }
  </style>
</head>
<body>
  <div class="bg-video" aria-hidden="true">
    <video id="bgvid" autoplay muted loop playsinline preload="auto" poster="Poster.jpg">
      <source src="Lightning.webm" type="video/webm" />
      <source src="Lightning.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>
  <div class="bg-tint" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="tabs" aria-label="Portfolio Sections">
      <a class="tab" href="#about" data-section-link="about" aria-current="true">About</a>
      <a class="tab" href="#projects" data-section-link="projects">Projects</a>
      <a class="tab" href="#experience" data-section-link="experience">Experience</a>
      <a class="tab" href="#resume" data-section-link="resume">Resume</a>
      <a class="tab" href="#contact" data-section-link="contact">Contact</a>
    </nav>
  </header>

  <main class="portfolio-page container">
    <section
      id="about"
      class="portfolio-section"
      data-section="about"
      data-fragment="Sections/About.html"
      data-module="./Sections/About.js"
      aria-labelledby="section-title-about"
    >
      <div class="section-shell">
        <div class="section-heading">
          <p class="section-kicker">About</p>
          <h2 id="section-title-about">
            Hi, I'm Carlo Russo
            <span class="about-role-line">
              <span class="about-role-prefix">|</span>
              <span
                class="about-role-typing"
                data-typing-roles="Software Engineer|AI/ML Engineer|Robotics Engineer"
                aria-live="polite"
              ></span>
            </span>
          </h2>
        </div>
        <div id="panel-about" class="section-panel">
          <div class="section-content" data-section-content></div>
        </div>
      </div>
    </section>

    <section
      id="projects"
      class="portfolio-section"
      data-section="projects"
      data-fragment="Sections/Projects.html"
      data-module="./Sections/Projects.js"
      aria-labelledby="section-title-projects"
    >
      <div class="section-shell">
        <div class="section-heading">
          <p class="section-kicker">Projects</p>
          <h2 id="section-title-projects">Selected work</h2>
        </div>
        <div id="panel-projects" class="section-panel">
          <div class="section-content" data-section-content></div>
        </div>
      </div>
    </section>

    <section
      id="experience"
      class="portfolio-section"
      data-section="experience"
      data-fragment="Sections/Experience.html"
      data-module="./Sections/Experience.js"
      aria-labelledby="section-title-experience"
    >
      <div class="section-shell">
        <div class="section-heading">
          <p class="section-kicker">Experience</p>
          <h2 id="section-title-experience">Professional timeline</h2>
        </div>
        <div id="panel-experience" class="section-panel">
          <div class="section-content" data-section-content></div>
        </div>
      </div>
    </section>

    <section
      id="resume"
      class="portfolio-section"
      data-section="resume"
      data-fragment="Sections/Resume.html"
      data-module="./Sections/Resume.js"
      aria-labelledby="section-title-resume"
    >
      <div class="section-shell">
        <div class="section-heading">
          <p class="section-kicker">Resume</p>
          <h2 id="section-title-resume">Preview and download</h2>
        </div>
        <div id="panel-resume" class="section-panel">
          <div class="section-content" data-section-content></div>
        </div>
      </div>
    </section>

    <section
      id="contact"
      class="portfolio-section"
      data-section="contact"
      data-fragment="Sections/Contact.html"
      aria-labelledby="section-title-contact"
    >
      <div class="section-shell">
        <div class="section-heading">
          <h2 id="section-title-contact">Get in touch</h2>
          <p class="section-subtitle">Let's connect</p>
        </div>
        <div id="panel-contact" class="section-panel">
          <div class="section-content" data-section-content></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const vid = document.getElementById('bgvid');
      const RATE = 0.6;
      function applyRate() {
        if (!vid) return;
        vid.defaultPlaybackRate = RATE;
        vid.playbackRate = RATE;
      }
      vid?.addEventListener('loadedmetadata', applyRate);
      vid?.addEventListener('play', applyRate);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) applyRate(); });
      applyRate();
    })();
  </script>

  <script type="module" src="./Main.js"></script>
</body>
</html>
